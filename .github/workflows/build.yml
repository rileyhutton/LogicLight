name: Build LogicLight

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip app
        run: ditto -c -k --keepParent LogicLight.app LogicLight.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LogicLight
          path: LogicLight.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LogicLight.zip
          generate_release_notes: true
