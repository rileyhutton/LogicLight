name: Build LogicLight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          chmod +x build.sh
          swiftc --version
          set +e
          ./build.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Surface compiler errors as annotations so they're visible without the raw log.
          grep -E '^[^ ]+\.swift:[0-9]+:[0-9]+: error:' build.log | sort -u | head -40 | \
            sed -E 's#^([^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#'
          grep -E '^(error|fatal|ld:)' build.log | sort -u | head -20 | sed 's/^/::error::/'
          exit $status

      - name: Zip app
        run: ditto -c -k --keepParent LogicLight.app LogicLight.zip

      - uses: actions/upload-artifact@v5
        with:
          name: LogicLight
          path: LogicLight.zip

      - name: Read version
        id: version
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Every push to main publishes (or refreshes) the release for the version in VERSION.
      # Bump VERSION to cut a new release.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: LogicLight ${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: LogicLight.zip
          body: |
            Download **LogicLight.zip**, unzip it and move **LogicLight.app** to Applications.
            It isn't notarised, so the first time right-click it and choose **Open** (or run `xattr -cr /Applications/LogicLight.app`).
            See the README for setup.
